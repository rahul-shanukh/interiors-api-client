steps:
  - name: "node:20-alpine"
    entrypoint: sh
    args:
      [
        "-c",
        "corepack enable && corepack prepare pnpm@latest --activate && pnpm install --frozen-lockfile",
      ]

  - name: "node:20-alpine"
    entrypoint: sh
    args: ["-c", "corepack enable && pnpm lint"]

  - name: "node:20-alpine"
    entrypoint: sh
    args: ["-c", "corepack enable && pnpm test"]

  - name: "node:20-alpine"
    entrypoint: sh
    args: ["-c", "corepack enable && pnpm build"]

options:
  logging: CLOUD_LOGGING_ONLY
