global:
  scrape_interval: 5s # Scrape metrics every 5 seconds for real-time feedback

scrape_configs:
  - job_name: 'nestjs-backend'
    metrics_path: '/api/v1/metrics'
    static_configs:
      # host.docker.internal allows the Docker container to reach your Windows localhost
      - targets: ['host.docker.internal:3000']
