# C:\Users\techp\Desktop\NestJS\backend\docker-compose.yml

services:
  # --- CACHE LAYER ---
  redis:
    image: redis:7-alpine
    container_name: employee-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # --- OBSERVABILITY LAYER ---
  prometheus:
    image: prom/prometheus:latest
    container_name: nestjs_prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: nestjs_grafana
    ports:
      - '3001:3000'
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped

  # --- APPLICATION LAYER ---
  backend:
    build: .
    image: employee-backend:1.0.0
    container_name: employee-backend
    restart: on-failure:2
    ports:
      - '3000:3000'
    env_file:
      - .env.docker
    depends_on:
      redis:
        condition: service_healthy
